<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title data-i18n="notFoundTitle">Seite nicht gefunden – Omega</title>
  <meta name="theme-color" content="#07080c" />
  <link rel="icon" href="/shared/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/shared/images/favicon-16.png" />
  <link rel="stylesheet" href="/hub/style.css" />
</head>
<body class="page-notfound">

  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
  </div>

  <header class="topbar-wrap">
    <div class="topbar">
      <a class="brand" href="/" data-i18n-aria="homeLabel" aria-label="Omega – Startseite">
        <span class="logo-wrap">
          <img class="logo-img" src="/shared/images/omega-logo.png" alt="" width="34" height="34" decoding="async" />
        </span>
        <span class="brand-name">Omega</span>
      </a>

      <nav class="top-actions">
        <a class="nav-link" href="/about/" data-i18n="navAbout">Über mich</a>
        <label class="sr-only" for="lang-select" data-i18n="languageLabel">Sprache</label>
        <select id="lang-select" class="select">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="zh">中文</option>
        </select>
      </nav>
    </div>
  </header>

  <main class="container notfound">
    <h1 class="notfound-code">404</h1>
    <p class="notfound-text" data-i18n="notFoundText">Diese Seite gibt es (noch) nicht.</p>

    <div class="terminal terminal--compact" aria-hidden="true">
      <div class="term-bar">
        <span class="term-dots"><i></i><i></i><i></i></span>
        <span class="term-title">paul@omega: ~</span>
      </div>
      <div class="term-body" id="term-body" data-script="notfound">
        <div class="term-line"><span class="term-prompt">paul@omega:~$</span> cd …</div>
        <div class="term-line term-out term-error">bash: cd: Datei oder Verzeichnis nicht gefunden</div>
        <div class="term-line"><span class="term-prompt">paul@omega:~$</span> <span class="term-cursor"></span></div>
      </div>
    </div>

    <a class="home-btn" href="/">
      <span aria-hidden="true">←</span>
      <span data-i18n="notFoundHome">Zur Startseite</span>
    </a>
  </main>

  <script src="/hub/app.js" defer></script>
</body>
</html>
